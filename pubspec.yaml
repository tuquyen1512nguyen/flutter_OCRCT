publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  image_picker: ^1.2.4
  google_mlkit_text_recognition: ^0.17.1
  sqflite: ^2.4.4+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.1
  intl: ^0.20.3
  path_provider: ^2.1.6
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
